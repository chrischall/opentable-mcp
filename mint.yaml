version: 1
name: OpenTable
slug: opentable
summary: >-
  OpenTable reservation management for Claude — find slots, book, cancel,
  list reservations, manage favorites, search restaurants. Relays every
  request through the fetchproxy browser extension
  (github.com/chrischall/fetchproxy) running in your signed-in opentable.com
  tab, so there's no cookie paste or bot-wall dance.
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: OT_BRIDGE
    required: false
    help: >-
      Which browser transport to use: "websocket" (default, the fetchproxy
      bridge) or "mcp-chrome".
  - name: OT_MCP_CHROME_URL
    required: false
    help: >-
      URL of the mcp-chrome bridge. Only used when OT_BRIDGE=mcp-chrome.
  - name: OT_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy browser bridge (defaults to the
      fleet-shared 37149). The runner injects a per-registration port for a
      hosted bridged child, so this is the name to give bridgePortEnv at
      registration.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # Both transports are bridges, so the process dials NO public host:
  #   - fetchproxy (default, OT_BRIDGE unset): www.opentable.com is dialled
  #     by the user's signed-in tab; the process only listens on the
  #     loopback concentrator port (OT_WS_PORT) the runner's agent connects
  #     to (src/transport-fetchproxy.ts).
  #   - mcp-chrome (OT_BRIDGE=mcp-chrome): the process talks HTTP to
  #     mcp-chrome on 127.0.0.1:12306 (src/transport-mcp-chrome.ts), and
  #     the tab dials opentable.com — loopback, not egress.
  # There is no direct/bootstrap mode. www.opentable.com appears in src only
  # as a path base handed to the bridge or as URLs returned to the user
  # (src/tools/restaurants.ts BASE_URL, src/tools/booking-flow.ts
  # SCA_REDIRECT_URL).
  allow: []
